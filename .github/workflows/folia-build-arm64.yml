name: Build ARM64 DEB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 make g++ fpm ruby ruby-dev

      - name: Install npm dependencies
        run: |
          npm install --force
          npm install @rollup/rollup-linux-arm64-gnu --save-optional

      - name: Build Application
        run: |
          npm run build
          npm run build:windowtolayer
          npx electron-builder --linux deb --arm64 -p never

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folia-arm64-deb
          path: release/*.deb
